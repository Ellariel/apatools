name: publish

# Publishes to PyPI when a GitHub release is published. Uses PyPI "Trusted Publishing" (OIDC), so no
# API token is stored. One-time setup on PyPI: Account -> Publishing -> add a (pending) publisher with
#   owner: Ellariel, repository: apatools, workflow: publish.yml, environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:  # manual run: builds and checks only, does not upload

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: python -m pip install --upgrade build twine && python -m build
      - name: Check the distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/apatools
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
