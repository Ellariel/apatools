name: tests

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  core:
    # the base installation (numpy + scipy only) must work on its own: calc, format and the packaging checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package WITHOUT extras
        run: python -m pip install --upgrade pip && python -m pip install . pytest
      - name: Test the core installation
        # tests that need an extra are skipped by tests/conftest.py
        run: |
          mkdir -p /tmp/run && cp -r tests /tmp/run/tests && cd /tmp/run
          python -m pytest tests -q
          python -c "import pandas" 2>/dev/null && { echo "pandas must not be installed in the core job"; exit 1; } || true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Graphviz (SEM path diagrams)
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install the package with all extras
        run: python -m pip install --upgrade pip && python -m pip install ".[all]" pytest "ruff~=0.17.5"  # pinned: a new ruff release must not break the build by itself
      - name: Lint
        run: ruff check apatools tests
      - name: Test the installed package
        # run from a copy of the tests so that the installed package, not the source tree, is imported
        run: |
          mkdir -p /tmp/run && cp -r tests /tmp/run/tests && cd /tmp/run
          python -m pytest tests -q

  docs:
    # the documentation must build without warnings (broken cross-references, malformed docstrings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Graphviz (imported by the sem module)
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install the package with all extras and the documentation tools
        run: python -m pip install --upgrade pip && python -m pip install ".[all,docs]"
      - name: Build the documentation
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

  lavaan:
    # the R engines of apatools.sem (sem(engine="lavaan"), sem_plot(engine="lavaan")): these tests are
    # skipped in the job above because R is not installed there
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true  # binary packages: semPlot has many dependencies
      - name: Install the R packages
        run: Rscript -e 'install.packages(c("lavaan", "semPlot"))'
      - name: Install the package with the sem extra
        run: python -m pip install --upgrade pip && python -m pip install ".[sem]" pytest
      - name: Test the R engines
        run: |
          mkdir -p /tmp/run && cp -r tests /tmp/run/tests && cd /tmp/run
          python -m pytest tests/test_lavaan.py -q -rs
