name: docs

# Builds the documentation and publishes it with GitHub Pages (Settings -> Pages -> Source: "GitHub Actions").
# The site shows the state of the main branch, i.e. the released version; the docs job of ci.yml only checks
# that the documentation builds without warnings.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Graphviz (imported by the sem module)
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install the package with all extras and the documentation tools
        run: python -m pip install --upgrade pip && python -m pip install ".[all,docs]"
      - name: Build the documentation
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
